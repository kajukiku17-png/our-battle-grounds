              </div>
              <div>
                <label for="joinBioInput" class="block text-xs font-semibold mb-1" style="color: var(--ink-secondary);">Short Bio</label>
                <input type="text" id="joinBioInput" class="field-input" placeholder="Ready to climb the weekly board" maxlength="100" />
              </div>
              <div class="flex items-center justify-end gap-2 pt-2">
                <button type="button" data-close-modal class="btn-soft px-4 py-2 text-sm">Cancel</button>
                <button type="submit" class="btn-primary px-5 py-2 text-sm">Join Space</button>
              </div>
              <div class="flex items-center gap-3 pt-1">
                <span class="h-px flex-1" style="background: var(--border-warm);"></span>
                <span class="text-[11px] font-semibold uppercase" style="color: var(--ink-muted);">or with Gmail</span>
                <span class="h-px flex-1" style="background: var(--border-warm);"></span>
              </div>
              <button type="button" data-google-oauth class="w-full py-2.5 px-4 rounded-[14px] border text-sm font-semibold inline-flex items-center justify-center gap-2.5 transition-colors hover:bg-black/[0.02]" style="background: var(--bg-elevated); border-color: var(--border-strong); color: var(--ink-primary);">
                ${GOOGLE_G_SVG}
                <span>Continue with Google</span>
              </button>
            </form>
          </div>
        `);

        document.getElementById("joinFriendForm").addEventListener("submit", (e) => {
          e.preventDefault();
          const code = document.getElementById("joinInviteCodeInput").value.trim().toUpperCase();
          const name = document.getElementById("joinNameInput").value.trim();
          const role = document.getElementById("joinRoleInput").value;
          const bio = document.getElementById("joinBioInput").value.trim();
          if (code !== state.inviteCode.toUpperCase()) {
            showToast(`Invite code did not match (${state.inviteCode}).`);
            return;
          }
          const newUser = {
            id: generateId("u"),
            username: name,
            email: `${name.toLowerCase().replace(/[^a-z0-9]/g, "")}@ourbattlegrounds.app`,
            role,
            bio: bio || "Excited to track daily wins together.",
            avatar: DEFAULT_ASSETS.friend,
            cover: DEFAULT_ASSETS.cover,
            theme: "cream-latte",
            cheers: 1
          };
          state.users.push(newUser);
          state.activeUserId = newUser.id;
          state.isAuthenticated = true;
          // Give them one starter welcome task
          state.tasks.unshift({
            id: generateId("t"),
            userId: newUser.id,
            title: "Customize my cozy profile & theme",
            description: "Upload a profile picture and set my first weekly goal.",
            deadline: todayISO(0),
            priority: "low",
            category: "Personal",
            completed: false,
            isShared: false,
            image: "",
            createdAt: Date.now(),
            completedAt: null
          });
          saveState();
          closeModal();
          showToast(`${name} joined ${state.spaceName}!`);
          currentView = "dashboard";
          renderApp();
        });
      }

      function openSupabaseModal() {
        openModal(`
          <div class="surface-card w-full max-w-xl max-h-[90vh] overflow-y-auto p-6 space-y-5">
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-2.5">
                <span class="w-9 h-9 rounded-xl flex items-center justify-center" style="background: var(--accent-sage-soft); color: var(--accent-sage);">
                  <i data-lucide="database" class="w-5 h-5"></i>
                </span>
                <div>
                  <h2 class="font-display text-xl font-semibold" style="color: var(--ink-primary);">Supabase Cloud Sync & Auth</h2>
                  <p class="text-xs" style="color: var(--ink-secondary);">Connect your Supabase project for live multi-device sync across phones, tablets & computers.</p>
                </div>
              </div>
              <button type="button" data-close-modal class="p-1.5 rounded-xl hover:bg-black/5" aria-label="Close"><i data-lucide="x" class="w-5 h-5" style="color: var(--ink-muted);"></i></button>
            </div>

            <form id="supabaseConfigForm" class="space-y-3.5">
              <div>
                <label for="supaUrlInput" class="block text-xs font-semibold mb-1" style="color: var(--ink-secondary);">Supabase Project URL</label>
                <input type="url" id="supaUrlInput" class="field-input font-mono text-xs" placeholder="https://your-project-id.supabase.co" value="${escapeHtml(supabaseConfig.url || "")}" />
              </div>
              <div>
                <label for="supaKeyInput" class="block text-xs font-semibold mb-1" style="color: var(--ink-secondary);">Supabase Anon Public Key</label>
                <input type="password" id="supaKeyInput" class="field-input font-mono text-xs" placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6..." value="${escapeHtml(supabaseConfig.anonKey || "")}" />
              </div>
              <div class="flex flex-wrap items-center justify-between gap-2 pt-1">
                <span class="text-xs font-semibold" style="color: ${supabaseConnected ? "var(--accent-sage)" : "var(--ink-muted)"};">
                  Status: ${supabaseConnected ? "Connected to Supabase" : "Local Workspace Mode (auto-saved in browser)"}
                </span>
                <div class="flex gap-2">
                  ${supabaseConnected ? `<button type="button" id="disconnectSupaBtn" class="btn-soft px-3.5 py-2 text-xs">Disconnect</button>` : ""}
                  <button type="submit" class="btn-primary px-4 py-2 text-xs">Connect Supabase</button>
                </div>
              </div>
            </form>

            <!-- SQL Setup Copy Box -->
            <div class="surface-beige rounded-2xl p-4 space-y-2.5">
              <div class="flex items-center justify-between">
                <span class="text-xs font-bold" style="color: var(--ink-primary);">1-Click Supabase SQL Schema & Storage Buckets</span>
                <button type="button" id="copySqlSchemaBtn" class="btn-rose px-3 py-1.5 text-xs inline-flex items-center gap-1">
                  <i data-lucide="copy" class="w-3.5 h-3.5"></i>
                  <span>Copy SQL</span>
                </button>
              </div>
              <pre class="text-[11px] leading-relaxed p-3 rounded-xl overflow-x-auto max-h-40 font-mono" style="background: var(--bg-card); color: var(--ink-secondary); border: 1px solid var(--border-warm);">${escapeHtml(SUPABASE_SQL_SCHEMA)}</pre>
            </div>
          </div>
        `);

        document.getElementById("copySqlSchemaBtn").addEventListener("click", () => {
          copyTextToClipboard(SUPABASE_SQL_SCHEMA);
        });

        const disc = document.getElementById("disconnectSupaBtn");
        if (disc) {
          disc.addEventListener("click", () => {
            supabaseClient = null;
            supabaseConnected = false;
            saveSupaConfig({ url: "", anonKey: "" });
            updateSyncBadge();
            closeModal();
            showToast("Switched back to Local Workspace Mode.");
          });
        }

        document.getElementById("supabaseConfigForm").addEventListener("submit", async (e) => {
          e.preventDefault();
          const url = document.getElementById("supaUrlInput").value.trim();
          const key = document.getElementById("supaKeyInput").value.trim();
          if (!url || !key) {
            showToast("Enter both your Supabase URL and Anon Key.");
            return;
          }
          const ok = await initSupabaseConnection(url, key, false);
          if (ok) closeModal();
        });
      }

      /* =========================================================
         6. EVENT BINDINGS
         ========================================================= */
      function toggleTaskCompletion(taskId) {
        const task = state.tasks.find((t) => t.id === taskId);
        if (!task) return;
        const user = getActiveUser();
        const prevStats = getUserStats(user.id, "all");
        task.completed = !task.completed;
        task.completedAt = task.completed ? Date.now() : null;
        task.completedBy = task.completed ? user.id : null;
        saveState();
        syncTaskToSupabase(task, "upsert");
        const newStats = getUserStats(user.id, "all");
        renderApp(false);
        if (task.completed && newStats.percent === 100 && prevStats.percent < 100) {
          celebrateCompletion();
          showToast("100% completed! Amazing work today ♡");
        }
      }

      function bindViewEvents() {
        // Jump buttons
        document.querySelectorAll("[data-jump]").forEach((btn) => {
          btn.addEventListener("click", () => {
            currentView = btn.getAttribute("data-jump");
            window.scrollTo({ top: 0, behavior: "smooth" });
            renderApp();
          });
        });

        // Task toggle buttons
        document.querySelectorAll("[data-toggle-task]").forEach((btn) => {
          btn.addEventListener("click", () => toggleTaskCompletion(btn.getAttribute("data-toggle-task")));
        });

        // Edit / Delete / View Image
        document.querySelectorAll("[data-edit-task]").forEach((btn) => {
          btn.addEventListener("click", () => openTaskModal(btn.getAttribute("data-edit-task")));
        });
        document.querySelectorAll("[data-delete-task]").forEach((btn) => {
          btn.addEventListener("click", () => openDeleteConfirmModal(btn.getAttribute("data-delete-task")));
        });
        document.querySelectorAll("[data-view-img]").forEach((btn) => {
          btn.addEventListener("click", () => openImageLightbox(btn.getAttribute("data-view-img")));
        });

        // Peek / Cheer / Switch User
        document.querySelectorAll("[data-peek-user]").forEach((btn) => {
          btn.addEventListener("click", () => openPeekUserModal(btn.getAttribute("data-peek-user")));
        });
        document.querySelectorAll("[data-cheer-user]").forEach((btn) => {
          btn.addEventListener("click", () => {
            const u = getUserById(btn.getAttribute("data-cheer-user"));
            if (!u) return;
            u.cheers = (u.cheers || 0) + 1;
            saveState();
            syncProfileToSupabase(u);
            showToast(`Sent a warm cheer to ${u.username}!`);
            renderApp();
          });
        });
        document.querySelectorAll("[data-remove-member]").forEach((btn) => {
          btn.addEventListener("click", () => {
            const uid = btn.getAttribute("data-remove-member");
            const member = getUserById(uid);
            if (!member || uid === state.activeUserId) return;
            openModal(`
              <div class="surface-card w-full max-w-sm p-6 space-y-4">
                <h2 class="font-display text-xl font-semibold" style="color: var(--ink-primary);">Remove ${escapeHtml(member.username)}?</h2>
                <p class="text-sm" style="color: var(--ink-secondary);">This removes ${escapeHtml(member.username)} and their personal tasks from this workspace.</p>
                <div class="flex justify-end gap-2">
                  <button type="button" data-close-modal class="btn-soft px-4 py-2 text-sm">Cancel</button>
                  <button type="button" id="confirmRemoveMemberBtn" class="btn-rose px-4 py-2 text-sm">Remove</button>
                </div>
              </div>
            `);
            document.getElementById("confirmRemoveMemberBtn").addEventListener("click", () => {
              state.users = state.users.filter((u) => u.id !== uid);
              state.tasks = state.tasks.filter((t) => t.isShared || t.userId !== uid);
              saveState();
              closeModal();
              showToast(`Removed ${member.username} from the space.`);
              renderApp(false);
            });
          });
        });

        const clearDemoBtn = document.getElementById("clearDemoMembersBtn");
        if (clearDemoBtn) {
          clearDemoBtn.addEventListener("click", () => {
            const active = getActiveUser();
            openModal(`
              <div class="surface-card w-full max-w-sm p-6 space-y-4">
                <h2 class="font-display text-xl font-semibold" style="color: var(--ink-primary);">Clear demo profiles?</h2>
                <p class="text-sm" style="color: var(--ink-secondary);">Keeps only your active profile (${escapeHtml(active.username)}) and your tasks, removing other starter profiles so you can invite your real partner and friends.</p>
                <div class="flex justify-end gap-2">
                  <button type="button" data-close-modal class="btn-soft px-4 py-2 text-sm">Cancel</button>
                  <button type="button" id="confirmClearDemoBtn" class="btn-primary px-4 py-2 text-sm">Clear Demo Profiles</button>
                </div>
              </div>
            `);
            document.getElementById("confirmClearDemoBtn").addEventListener("click", () => {
              state.users = [active];
              state.tasks = state.tasks.filter((t) => t.userId === active.id || t.isShared);
              saveState();
              closeModal();
              showToast("Cleared demo profiles! Ready for your real invites.");
              renderApp(false);
            });
          });
        }

        document.querySelectorAll("[data-switch-user]").forEach((btn) => {
          btn.addEventListener("click", () => {
            const uid = btn.getAttribute("data-switch-user");
            state.activeUserId = uid;
            saveState();
            const u = getUserById(uid);
            showToast(`Switched to ${u ? u.username : "Member"}'s dashboard`);
            currentView = "dashboard";
            renderApp();
          });
        });

        // Dashboard specific
        const dashAdd = document.getElementById("dashAddTaskBtn");
        if (dashAdd) dashAdd.addEventListener("click", () => openTaskModal());

        const nextQuote = document.getElementById("nextQuoteBtn");
        if (nextQuote) {
          nextQuote.addEventListener("click", () => {
            state.quoteIndex = (state.quoteIndex + 1) % DAILY_QUOTES.length;
            saveState();
            renderApp();
          });
        }

        const quickForm = document.getElementById("quickAddForm");
        if (quickForm) {
          quickForm.addEventListener("submit", (e) => {
            e.preventDefault();
            const input = document.getElementById("quickAddInput");
            const priority = document.getElementById("quickAddPriority").value;
            const title = input.value.trim();
            if (!title) return;
            const newTask = {
              id: generateId("t"),
              userId: getActiveUser().id,
              title,
              description: "",
              deadline: todayISO(0),
              priority,
              category: "Personal",
              completed: false,
              isShared: false,
              image: "",
              createdAt: Date.now(),
              completedAt: null
            };
            state.tasks.unshift(newTask);
            saveState();
            syncTaskToSupabase(newTask, "upsert");
            showToast("Task added to today's list!");
            renderApp();
          });
        }

        // Tasks view specific
        const openNewTask = document.getElementById("openNewTaskModalBtn");
        if (openNewTask) openNewTask.addEventListener("click", () => openTaskModal());

        document.querySelectorAll("[data-task-tab]").forEach((btn) => {
          btn.addEventListener("click", () => {
            taskFilterStatus = btn.getAttribute("data-task-tab");
            renderApp(false);
          });
        });

        const searchEl = document.getElementById("taskSearchInput");
        if (searchEl) {
          searchEl.addEventListener("input", (e) => {
            taskSearchQuery = e.target.value;
            renderApp(false);
            const refocused = document.getElementById("taskSearchInput");
            if (refocused) {
              refocused.focus();
              refocused.setSelectionRange(refocused.value.length, refocused.value.length);
            }
          });
        }

        const catFilter = document.getElementById("taskCategoryFilter");
        if (catFilter) catFilter.addEventListener("change", (e) => { taskFilterCategory = e.target.value; renderApp(); });

        const prioFilter = document.getElementById("taskPriorityFilter");
        if (prioFilter) prioFilter.addEventListener("change", (e) => { taskFilterPriority = e.target.value; renderApp(); });

        const sortSel = document.getElementById("taskSortSelect");
        if (sortSel) sortSel.addEventListener("change", (e) => { taskSortBy = e.target.value; renderApp(); });

        // Leaderboard view specific
        document.querySelectorAll("[data-lb-range]").forEach((btn) => {
          btn.addEventListener("click", () => {
            leaderboardRange = btn.getAttribute("data-lb-range");
            renderApp();
          });
        });

        // Shared space view specific
        const newSharedBtn = document.getElementById("openNewSharedTaskBtn");
        if (newSharedBtn) newSharedBtn.addEventListener("click", () => openTaskModal(null, true));

        const joinBtn = document.getElementById("openJoinInviteModalBtn");
        if (joinBtn) joinBtn.addEventListener("click", () => openJoinFriendModal());

        const addFriendDirect = document.getElementById("openAddFriendDirectBtn");
        if (addFriendDirect) addFriendDirect.addEventListener("click", () => openJoinFriendModal(state.inviteCode));

        const friendSearch = document.getElementById("friendSearchInput");
        if (friendSearch) {
          friendSearch.addEventListener("input", (e) => {
            friendSearchQuery = e.target.value;
            renderApp(false);
            const refocused = document.getElementById("friendSearchInput");
            if (refocused) {
              refocused.focus();
              refocused.setSelectionRange(refocused.value.length, refocused.value.length);
            }
          });
        }

        const copyInvite = document.getElementById("copyInviteBtn");
        if (copyInvite) {
          copyInvite.addEventListener("click", () => {
            const val = document.getElementById("inviteLinkInput").value;
            copyTextToClipboard(val);
          });
        }

        const regenInvite = document.getElementById("regenInviteBtn");
        if (regenInvite) {
          regenInvite.addEventListener("click", () => {
            state.inviteCode = generateInviteCode();
            saveState();
            showToast(`New invite code generated: ${state.inviteCode}`);
            renderApp();
          });
        }

        // Profile view specific
        const avatarInput = document.getElementById("avatarUploadInput");
        if (avatarInput) {
          avatarInput.addEventListener("change", async (e) => {
            const file = e.target.files && e.target.files[0];
            if (!file) return;
            try {
              const dataUrl = await uploadImageToStorageOrLocal(file, "avatars", 320, 320, 0.85);
              getActiveUser().avatar = dataUrl;
              saveState();
              syncProfileToSupabase(getActiveUser());
              showToast("Profile picture updated!");
              renderApp();
            } catch (err) {
              showToast("Could not process profile picture.");
            }
          });
        }

        const coverInput = document.getElementById("coverUploadInput");
        if (coverInput) {
          coverInput.addEventListener("change", async (e) => {
            const file = e.target.files && e.target.files[0];
            if (!file) return;
            try {
              const dataUrl = await uploadImageToStorageOrLocal(file, "covers", 1080, 540, 0.82);
              getActiveUser().cover = dataUrl;
              saveState();
              syncProfileToSupabase(getActiveUser());
              showToast("Cover photo updated!");
              renderApp();
            } catch (err) {
              showToast("Could not process cover photo.");
            }
          });
        }

        const profileForm = document.getElementById("profileEditForm");
        if (profileForm) {
          profileForm.addEventListener("submit", (e) => {
            e.preventDefault();
            const user = getActiveUser();
            const newName = document.getElementById("profileUsernameInput").value.trim();
            if (newName) user.username = newName;
            user.role = document.getElementById("profileRoleInput").value;
            user.bio = document.getElementById("profileBioInput").value.trim();
            const spaceName = document.getElementById("spaceNameInput").value.trim();
            if (spaceName) state.spaceName = spaceName;
            saveState();
            syncProfileToSupabase(user);
            showToast("Profile saved!");
            renderApp();
          });
        }

        document.querySelectorAll("[data-select-theme]").forEach((btn) => {
          btn.addEventListener("click", () => {
            getActiveUser().theme = btn.getAttribute("data-select-theme");
            saveState();
            syncProfileToSupabase(getActiveUser());
            showToast("Theme updated!");
            renderApp();
          });
        });

        const profileSupaBtn = document.getElementById("profileOpenSupabaseBtn");
        if (profileSupaBtn) profileSupaBtn.addEventListener("click", () => openSupabaseModal());
        const profileSignOut = document.getElementById("profileSignOutBtn");
        if (profileSignOut) profileSignOut.addEventListener("click", () => signOutUser());

        const exportBtn = document.getElementById("exportDataBtn");
        if (exportBtn) {
          exportBtn.addEventListener("click", () => {
            const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "our-battle-grounds-backup.json";
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
            showToast("Workspace backup downloaded!");
          });
        }

        const importInput = document.getElementById("importDataInput");
        if (importInput) {
          importInput.addEventListener("change", (e) => {
            const file = e.target.files && e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
              try {
                const parsed = JSON.parse(ev.target.result);
                if (!parsed || !Array.isArray(parsed.users) || !Array.isArray(parsed.tasks)) {
                  showToast("Invalid backup file format.");
                  return;
                }
                state = parsed;
                saveState();
                showToast("Workspace backup imported!");
                renderApp(false);
              } catch (err) {
                showToast("Could not parse JSON backup.");
              }
            };
            reader.readAsText(file);
          });
        }

        const resetBtn = document.getElementById("resetDemoBtn");
        if (resetBtn) {
          resetBtn.addEventListener("click", () => {
            openModal(`
              <div class="surface-card w-full max-w-sm p-6 space-y-4">
                <h2 class="font-display text-xl font-semibold" style="color: var(--ink-primary);">Reset workspace?</h2>
                <p class="text-sm" style="color: var(--ink-secondary);">This restores the starter profiles and sample tasks.</p>
                <div class="flex justify-end gap-2">
                  <button type="button" data-close-modal class="btn-soft px-4 py-2 text-sm">Cancel</button>
                  <button type="button" id="confirmResetWorkspaceBtn" class="btn-rose px-4 py-2 text-sm">Reset</button>
                </div>
              </div>
            `);
            document.getElementById("confirmResetWorkspaceBtn").addEventListener("click", () => {
              state = createSeedState();
              saveState();
              closeModal();
              showToast("Starter workspace restored.");
              renderApp();
            });
          });
        }
      }

      /* =========================================================
         7. GLOBAL INIT & NAVIGATION LISTENERS
         ========================================================= */
      document.getElementById("brandHomeBtn").addEventListener("click", () => {
        currentView = "dashboard";
        window.scrollTo({ top: 0, behavior: "smooth" });
        renderApp();
      });

      document.querySelectorAll("[data-nav]").forEach((btn) => {
        btn.addEventListener("click", () => {
          currentView = btn.getAttribute("data-nav");
          window.scrollTo({ top: 0, behavior: "smooth" });
          renderApp();
        });
      });

      document.getElementById("openAccountBtn").addEventListener("click", () => openAccountSwitcherModal());
      document.getElementById("openSupabaseBtn").addEventListener("click", () => openSupabaseModal());

      // Delegated modal close on backdrop or close buttons
      document.getElementById("modalRoot").addEventListener("click", (e) => {
        if (e.target.closest("[data-google-oauth]")) {
          handleGoogleOAuthSignIn();
          return;
        }
        if (e.target.id === "modalRoot" || e.target.closest("[data-close-modal]")) {
          closeModal();
        }
      });

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeModal();
      });

      // Handle hash invite link (#/join/CODE)
      function checkInviteHash() {
        const hash = window.location.hash || "";
        const match = hash.match(/^#\/join\/([A-Za-z0-9-]+)$/);
        if (match) {
          openJoinFriendModal(match[1]);
        }
      }

      // Initialize app
      if (supabaseConfig.url && supabaseConfig.anonKey) {
        initSupabaseConnection(supabaseConfig.url, supabaseConfig.anonKey, true);
      }
      renderApp();
      checkInviteHash();
      window.addEventListener("hashchange", checkInviteHash);
    })();
  </script>
</body>
</html>
