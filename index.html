<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>OUR Battle Grounds — Cozy Tasks & Productivity Space</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.47.10/dist/umd/supabase.min.js"></script>
  <style>
    :root {
      --bg-canvas: #FAF6F1;
      --bg-beige: #F2E9DF;
      --bg-card: #FFFDF9;
      --bg-elevated: #FFFFFF;
      --ink-primary: #3A251B;
      --ink-secondary: #6E5244;
      --ink-muted: #9A8072;
      --border-warm: #E8DCD0;
      --border-strong: #D9C7B7;
      --accent-rose: #C97A88;
      --accent-rose-soft: #F7E5E8;
      --accent-pink: #E6B3BA;
      --accent-coffee: #6B4431;
      --accent-coffee-dark: #4B2E20;
      --accent-sage: #6D8E6B;
      --accent-sage-soft: #E9F1E8;
      --accent-honey: #C58A4A;
      --accent-honey-soft: #F9EFE2;
      --shadow-soft: 0 8px 28px -8px rgba(58, 37, 27, 0.08), 0 2px 6px -1px rgba(58, 37, 27, 0.04);
      --shadow-hover: 0 14px 34px -10px rgba(58, 37, 27, 0.13), 0 4px 10px -2px rgba(58, 37, 27, 0.06);
      --radius-card: 20px;
      --radius-pill: 9999px;
      --header-glass: rgba(250, 246, 241, 0.9);
      --nav-glass: rgba(255, 253, 249, 0.95);
    }

    [data-theme="rose-mocha"] {
      --bg-canvas: #FDF7F7;
      --bg-beige: #F6E9EA;
      --bg-card: #FFFCFC;
      --ink-primary: #3D2324;
      --ink-secondary: #754E51;
      --ink-muted: #A17D80;
      --border-warm: #EEDADD;
      --border-strong: #DFC2C7;
      --accent-rose: #B86575;
      --accent-rose-soft: #F9E3E7;
      --accent-pink: #E5A9B4;
      --accent-coffee: #6F3E45;
      --accent-coffee-dark: #4F292F;
      --header-glass: rgba(253, 247, 247, 0.92);
      --nav-glass: rgba(255, 252, 252, 0.96);
    }

    [data-theme="oat-matcha"] {
      --bg-canvas: #F8F7F2;
      --bg-beige: #ECEBE0;
      --bg-card: #FEFEFA;
      --ink-primary: #33271E;
      --ink-secondary: #635547;
      --ink-muted: #8F8274;
      --border-warm: #E2DFD1;
      --border-strong: #CFCAB8;
      --accent-rose: #C8838D;
      --accent-rose-soft: #F6E6E8;
      --accent-pink: #E4B5BC;
      --accent-coffee: #5D6F57;
      --accent-coffee-dark: #41513C;
      --header-glass: rgba(248, 247, 242, 0.92);
      --nav-glass: rgba(254, 254, 250, 0.96);
    }

    [data-theme="caramel-dusk"] {
      --bg-canvas: #F6EFE7;
      --bg-beige: #EBDDCE;
      --bg-card: #FCF8F3;
      --ink-primary: #301E15;
      --ink-secondary: #6A4B3A;
      --ink-muted: #947664;
      --border-warm: #E2CEBC;
      --border-strong: #D0B59D;
      --accent-rose: #C27B7F;
      --accent-rose-soft: #F5E3E3;
      --accent-pink: #DFABA8;
      --accent-coffee: #8B5734;
      --accent-coffee-dark: #5E381F;
      --header-glass: rgba(246, 239, 231, 0.92);
      --nav-glass: rgba(252, 248, 243, 0.96);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background-color: var(--bg-canvas);
      color: var(--ink-primary);
      line-height: 1.5;
      min-height: 100vh;
      overflow-x: hidden;
      caret-color: var(--accent-rose);
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    ::selection {
      background-color: var(--accent-rose-soft);
      color: var(--ink-primary);
    }

    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-canvas);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--border-strong);
      border-radius: 999px;
      border: 2px solid var(--bg-canvas);
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--ink-muted);
    }

    :focus-visible {
      outline: 2px solid var(--accent-rose);
      outline-offset: 2px;
    }

    .font-display {
      font-family: 'Fraunces', Georgia, serif;
      letter-spacing: -0.015em;
    }

    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }

    .surface-card {
      background: var(--bg-card);
      border: 1px solid var(--border-warm);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-soft);
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .surface-card-interactive:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-hover);
      border-color: var(--border-strong);
    }

    .surface-beige {
      background: var(--bg-beige);
      border: 1px solid var(--border-warm);
    }

    .btn-primary {
      background: var(--accent-coffee);
      color: #FFFDF9;
      border-radius: 14px;
      font-weight: 600;
      transition: background-color 0.18s ease, transform 0.15s ease, box-shadow 0.18s ease;
    }
    .btn-primary:hover {
      background: var(--accent-coffee-dark);
      box-shadow: 0 6px 18px -6px rgba(75, 46, 32, 0.35);
    }
    .btn-primary:active {
      transform: scale(0.98);
    }

    .btn-rose {
      background: var(--accent-rose);
      color: #FFFDF9;
      border-radius: 14px;
      font-weight: 600;
      transition: filter 0.18s ease, transform 0.15s ease;
    }
    .btn-rose:hover {
      filter: brightness(0.94);
    }
    .btn-rose:active {
      transform: scale(0.98);
    }

    .btn-soft {
      background: var(--bg-beige);
      color: var(--ink-primary);
      border: 1px solid var(--border-warm);
      border-radius: 14px;
      font-weight: 600;
      transition: background-color 0.18s ease, border-color 0.18s ease;
    }
    .btn-soft:hover {
      background: var(--border-warm);
      border-color: var(--border-strong);
    }

    .field-input {
      width: 100%;
      background: var(--bg-elevated);
      border: 1px solid var(--border-strong);
      border-radius: 14px;
      padding: 0.65rem 0.9rem;
      color: var(--ink-primary);
      font-size: 0.925rem;
      transition: border-color 0.18s ease, box-shadow 0.18s ease;
    }
    .field-input:focus {
      outline: none;
      border-color: var(--accent-rose);
      box-shadow: 0 0 0 3px var(--accent-rose-soft);
    }
    .field-input::placeholder {
      color: var(--ink-muted);
    }

    /* Animated Progress Bar */
    .progress-track {
      background: var(--bg-beige);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }
    .progress-fill {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--accent-coffee) 0%, var(--accent-rose) 100%);
      transition: width 0.55s cubic-bezier(0.22, 1, 0.36, 1);
      position: relative;
    }
    .progress-fill-sage {
      background: linear-gradient(90deg, #6D8E6B 0%, #8CB08A 100%);
    }

    /* Custom Task Checkbox */
    .task-check {
      width: 24px;
      height: 24px;
      border-radius: 8px;
      border: 2px solid var(--border-strong);
      background: var(--bg-elevated);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .task-check:hover {
      border-color: var(--accent-rose);
      background: var(--accent-rose-soft);
    }
    .task-check.checked {
      background: var(--accent-sage);
      border-color: var(--accent-sage);
      color: #FFFDF9;
      transform: scale(1.04);
    }

    /* Nav Active States */
    .nav-pill {
      color: var(--ink-secondary);
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.875rem;
      transition: background-color 0.18s ease, color 0.18s ease;
    }
    .nav-pill:hover {
      background: var(--bg-beige);
      color: var(--ink-primary);
    }
    .nav-pill.active {
      background: var(--accent-coffee);
      color: #FFFDF9;
    }
    .nav-pill-leaderboard {
      background: var(--accent-rose-soft);
      color: var(--accent-coffee-dark);
      border: 1px solid var(--accent-pink);
    }
    .nav-pill-leaderboard:hover {
      background: var(--accent-pink);
      color: var(--ink-primary);
    }
    .nav-pill-leaderboard.active {
      background: var(--accent-rose);
      color: #FFFDF9;
      border-color: var(--accent-rose);
    }

    /* View fade animation */
    @keyframes fadeSlideIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .view-enter {
      animation: fadeSlideIn 0.28s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* Modal backdrop */
    .modal-backdrop {
      background: rgba(42, 26, 18, 0.42);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
    }

    /* Toast */
    @keyframes toastIn {
      from { opacity: 0; transform: translate(-50%, 14px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }
    .toast-enter {
      animation: toastIn 0.24s ease forwards;
    }

    /* Mobile bottom safe area */
    .safe-bottom {
      padding-bottom: max(0.5rem, env(safe-area-inset-bottom));
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

        <button type="button" data-nav="shared" class="nav-pill px-3.5 py-2 flex items-center gap-1.5">

      function subscribeSupabaseRealtime() {
        if (!supabaseConnected || !supabaseClient) return;
        try {
          if (supabaseRealtimeChannel) {
            supabaseClient.removeChannel(supabaseRealtimeChannel);
          }
          supabaseRealtimeChannel = supabaseClient
            .channel("obg-live-sync")
            .on("postgres_changes", { event: "*", schema: "public", table: "tasks" }, () => {
              fetchSupabaseWorkspace();
            })
            .on("postgres_changes", { event: "*", schema: "public", table: "profiles" }, () => {
              fetchSupabaseWorkspace();
            })
            .subscribe();
        } catch (e) {
          // Realtime optional fallback
        }
      }

            supabaseClient.from("profiles").select("*"),
            supabaseClient.from("tasks").select("*").order("created_at", { ascending: false })
          ]);

      async function uploadImageToStorageOrLocal(file, bucket, maxW, maxH, quality) {
        const localDataUrl = await readImageAsCompressedDataUrl(file, maxW, maxH, quality);
        if (!supabaseConnected || !supabaseClient) return localDataUrl;
        try {
          const { data: sessionData } = await supabaseClient.auth.getSession();
          if (!sessionData || !sessionData.session) return localDataUrl;
          const uid = sessionData.session.user.id;
          const res = await fetch(localDataUrl);
          const blob = await res.blob();
          const filePath = `${uid}/${Date.now()}_${Math.random().toString(36).slice(2, 7)}.jpg`;
          const { error } = await supabaseClient.storage.from(bucket).upload(filePath, blob, {
            contentType: "image/jpeg",
            upsert: true
          });
          if (error) return localDataUrl;
          const { data: pub } = supabaseClient.storage.from(bucket).getPublicUrl(filePath);
          return (pub && pub.publicUrl) ? pub.publicUrl : localDataUrl;
        } catch (e) {
          return localDataUrl;
        }
      }

      function escapeHtml(str) {

          .replace(/&/g, "&amp;")

      function getUserTasks(userId, includeShared = true) {
        return state.tasks.filter((t) => {
          if (!t.isShared) return t.userId === userId;
          if (!includeShared) return false;
          return t.userId === userId || t.assigneeId === userId || t.assigneeId === "all";
        });
      }

      function getUserStats(userId, range = "all") {
        const weekAgo = Date.now() - 7 * 86400000;
        const relevant = state.tasks.filter((t) => {
          const inRange = range !== "weekly" || (t.createdAt || Date.now()) >= weekAgo || (t.completedAt && t.completedAt >= weekAgo);
          if (!inRange) return false;
          if (!t.isShared) return t.userId === userId;
          // Shared task explicitly assigned to this user
          if (t.assigneeId === userId) return true;
          // Open shared task ("all"): counts if this user completed it, or if pending and created by them
          if (t.assigneeId === "all") {
            if (t.completed) return t.completedBy === userId;
            return t.userId === userId;
          }
          return false;
        });
        const total = relevant.length;
        const completed = relevant.filter((t) => t.completed).length;
        const pending = total - completed;
        const percent = total > 0 ? Math.round((completed / total) * 100) : 0;
        return { total, completed, pending, percent };
      }

      function getLeaderboard(range = "weekly") {
        return state.users
          .map((user) => {
            const stats = getUserStats(user.id, range);
            return { user, ...stats };
          })
          .sort((a, b) => {
            if (b.percent !== a.percent) return b.percent - a.percent;
            if (b.completed !== a.completed) return b.completed - a.completed;
            return b.total - a.total;
          });
      }

      function formatFriendlyDate(isoDate) {
        if (!isoDate) return "No deadline";
        const today = todayISO(0);
        const tomorrow = todayISO(1);
        if (isoDate === today) return "Today";
        if (isoDate === tomorrow) return "Tomorrow";
        const parts = isoDate.split("-");
        if (parts.length !== 3) return isoDate;
        const d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
        return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
      }

      function isOverdue(task) {
        if (task.completed || !task.deadline) return false;
        return task.deadline < todayISO(0);

      function readImageAsCompressedDataUrl(file, maxW = 800, maxH = 800, quality = 0.82) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = (ev) => {
            const img = new Image();
            img.onload = () => {
              let w = img.width;
              let h = img.height;
              const ratio = Math.min(maxW / w, maxH / h, 1);
              w = Math.round(w * ratio);
              h = Math.round(h * ratio);
              const canvas = document.createElement("canvas");
              canvas.width = w;
              canvas.height = h;
              const ctx = canvas.getContext("2d");
              ctx.drawImage(img, 0, 0, w, h);
              resolve(canvas.toDataURL("image/jpeg", quality));
            };
            img.onerror = () => reject(new Error("Invalid image"));
            img.src = ev.target.result;
          };
          reader.onerror = () => reject(new Error("Could not read file"));
          reader.readAsDataURL(file);
        });
      }

      function copyTextToClipboard(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(
            () => showToast("Copied to clipboard!"),
            () => fallbackCopy(text)
          );
        } else {
          fallbackCopy(text);
        }
      }

      function fallbackCopy(text) {
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.select();
        try {
          document.execCommand("copy");
          showToast("Copied to clipboard!");
        } catch (e) {
          showToast("Copy unavailable — select and copy manually.");
        }
        document.body.removeChild(ta);
      }

        el.innerHTML = `<i data-lucide="sparkles" class="w-4 h-4" style="color: var(--accent-pink);"></i><span>${escapeHtml(message)}</span>`;

        if (window.lucide) lucide.createIcons({ nodes: [el] });
        setTimeout(() => {
          el.style.opacity = "0";
          el.style.transition = "opacity 0.25s ease";

                    <i data-lucide="refresh-cw" class="w-4 h-4" style="color: var(--ink-muted);"></i>
                  </button>
                </div>

                <blockquote class="my-5 relative z-10">
                  <p class="font-display text-xl sm:text-2xl font-medium leading-snug" style="color: var(--ink-primary);">
                    “${escapeHtml(quote.text)}”
                  </p>
                  <footer class="mt-3 text-xs font-semibold" style="color: var(--ink-muted);">
                    — ${escapeHtml(quote.author)}
                  </footer>
                </blockquote>

                <div class="flex items-center justify-between pt-3 border-t text-xs" style="border-color: var(--border-warm); color: var(--ink-secondary);">
                  <span class="tabular-nums">Weekly Rank: <strong style="color: var(--ink-primary);">#${myRankIndex + 1} of ${rankings.length}</strong></span>
                  <button type="button" data-jump="leaderboard" class="font-semibold inline-flex items-center gap-1 hover:underline" style="color: var(--accent-rose);">
                    <span>Open Leaderboard</span>
                    <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i>
                  </button>
                </div>

                <!-- Delicate Botanical Decorative SVG -->
                <svg class="absolute -bottom-3 -right-3 w-28 h-28 opacity-15 pointer-events-none" viewBox="0 0 120 120" fill="none" aria-hidden="true">
                  <path d="M22 106C44 82 64 56 96 20" stroke="#6B4431" stroke-width="2.2" stroke-linecap="round"/>
                  <path d="M52 74C46 58 54 44 68 46C66 60 60 68 52 74Z" fill="#C97A88"/>
                  <path d="M72 52C86 48 98 56 94 70C80 68 74 60 72 52Z" fill="#6B4431"/>
                  <path d="M38 88C24 84 18 72 28 64C38 70 40 78 38 88Z" fill="#6B4431"/>
                </svg>
              </section>
            </div>

            <!-- Quick Add & Two-Column Focus + Leaderboard Preview -->
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-5">
              <!-- Focus Tasks List -->
              <section class="lg:col-span-7 surface-card p-5 sm:p-6 space-y-4">
                <div class="flex items-center justify-between">
                  <h2 class="font-display text-xl font-semibold" style="color: var(--ink-primary);">Up Next</h2>
                  <button type="button" data-jump="tasks" class="text-xs font-semibold inline-flex items-center gap-1 hover:underline" style="color: var(--accent-coffee);">
                    <span>Manage all tasks</span>
                    <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i>
                  </button>
                </div>

                <!-- Notion-style Quick Add Bar -->
                <form id="quickAddForm" class="flex flex-col sm:flex-row gap-2">
                  <input type="text" id="quickAddInput" class="field-input flex-1" placeholder="Add a quick task for today..." required maxlength="120" />
                  <div class="flex gap-2">
                    <select id="quickAddPriority" class="field-input w-auto sm:w-28" aria-label="Task priority">
                      <option value="medium">Medium</option>
                      <option value="high">High</option>
                      <option value="low">Low</option>
                    </select>
                    <button type="submit" class="btn-primary px-4 py-2 text-sm shrink-0">Add</button>
                  </div>
                </form>

                <div class="space-y-2.5">
                  ${focusTasks.length === 0
                    ? `<div class="surface-beige rounded-2xl p-6 text-center text-sm" style="color: var(--ink-secondary);">No tasks yet — add your first cozy goal above.</div>`
                    : focusTasks.map((t) => renderCompactTaskRow(t)).join("")}
                </div>
              </section>

              <!-- Mini Battle Standings (Leaderboard Preview) -->
              <section class="lg:col-span-5 surface-card p-5 sm:p-6 space-y-4">
                <div class="flex items-center justify-between">
                  <div class="flex items-center gap-2">
                    <i data-lucide="trophy" class="w-5 h-5" style="color: var(--accent-rose);"></i>
                    <h2 class="font-display text-xl font-semibold" style="color: var(--ink-primary);">Weekly Standings</h2>
                  </div>
                  <button type="button" data-jump="leaderboard" class="text-xs font-semibold hover:underline" style="color: var(--accent-rose);">See full board</button>
                </div>

                <div class="space-y-3">
                  ${rankings.map((entry, idx) => `
                    <div class="p-3.5 rounded-2xl border transition-colors ${entry.user.id === user.id ? "surface-beige" : ""}" style="border-color: var(--border-warm);">
                      <div class="flex items-center justify-between gap-3">
                        <div class="flex items-center gap-3 min-w-0">
                          <span class="w-6 h-6 rounded-full text-xs font-bold flex items-center justify-center shrink-0 tabular-nums"
                            style="background: ${idx === 0 ? "var(--accent-rose)" : "var(--bg-beige)"}; color: ${idx === 0 ? "#FFFDF9" : "var(--ink-primary)"};">
                            ${idx + 1}
                          </span>
                          <img src="${escapeHtml(entry.user.avatar || DEFAULT_ASSETS.me)}" alt="${escapeHtml(entry.user.username)}" class="w-9 h-9 rounded-full object-cover border shrink-0" style="border-color: var(--border-warm);" />
                          <div class="min-w-0">
                            <div class="text-sm font-semibold truncate" style="color: var(--ink-primary);">
                              ${escapeHtml(entry.user.username)}
                              ${entry.user.id === user.id ? `<span class="text-[11px] font-medium ml-1" style="color: var(--accent-rose);">(You)</span>` : ""}
                            </div>
                            <div class="text-xs tabular-nums" style="color: var(--ink-muted);">${entry.completed}/${entry.total} tasks completed</div>
                          </div>
                        </div>
                        <span class="text-sm font-bold tabular-nums shrink-0" style="color: var(--ink-primary);">${entry.percent}%</span>
                      </div>
                      <div class="progress-track h-2 w-full mt-2.5">
                        <div class="progress-fill" style="width: ${entry.percent}%;"></div>
                      </div>
                    </div>
                  `).join("")}
                </div>
              </section>
            </div>
          </div>
        `;
      }

      function renderCompactTaskRow(task) {
        const overdue = isOverdue(task);
        return `
          <div class="flex items-center justify-between gap-3 p-3.5 rounded-2xl border transition-all hover:border-[var(--border-strong)]" style="background: var(--bg-elevated); border-color: var(--border-warm);">
            <div class="flex items-start gap-3 min-w-0">
              <button type="button" data-toggle-task="${escapeHtml(task.id)}" class="task-check mt-0.5 ${task.completed ? "checked" : ""}" aria-label="${task.completed ? "Mark incomplete" : "Mark complete"}">
                ${task.completed ? `<i data-lucide="check" class="w-3.5 h-3.5"></i>` : ""}
              </button>
              <div class="min-w-0">
                <div class="text-sm font-semibold truncate ${task.completed ? "line-through opacity-60" : ""}" style="color: var(--ink-primary);">
                  ${escapeHtml(task.title)}
                </div>
                <div class="flex flex-wrap items-center gap-2 mt-1 text-xs" style="color: var(--ink-muted);">
                  <span>${escapeHtml(task.category)}</span>
                  ${task.isShared ? `<span class="px-1.5 py-0.5 rounded-md font-semibold" style="background: var(--accent-rose-soft); color: var(--accent-rose);">Shared</span>` : ""}
                  <span class="tabular-nums ${overdue ? "font-semibold" : ""}" style="${overdue ? "color: var(--accent-rose);" : ""}">${escapeHtml(formatFriendlyDate(task.deadline))}</span>
                </div>
              </div>
            </div>
            <div class="flex items-center gap-2 shrink-0">
              ${task.image ? `<button type="button" data-view-img="${escapeHtml(task.id)}" class="w-8 h-8 rounded-lg overflow-hidden border shrink-0" style="border-color: var(--border-warm);" title="View attachment"><img src="${escapeHtml(task.image)}" alt="Attachment" class="w-full h-full object-cover" /></button>` : ""}
              ${priorityBadge(task.priority)}
            </div>
          </div>
        `;
      }

      /* ---------- VIEW 2: TASK MANAGER ---------- */
      function renderTasksView() {
        const user = getActiveUser();
        const allMyTasks = getUserTasks(user.id, true);
        const stats = getUserStats(user.id, "all");

        const filtered = allMyTasks
          .filter((t) => {
            if (taskFilterStatus === "pending") return !t.completed;
            if (taskFilterStatus === "completed") return t.completed;
            return true;
          })
          .filter((t) => (taskFilterCategory === "all" ? true : t.category === taskFilterCategory))
          .filter((t) => (taskFilterPriority === "all" ? true : t.priority === taskFilterPriority))
          .filter((t) => {
            if (!taskSearchQuery.trim()) return true;
            const q = taskSearchQuery.toLowerCase();
            return t.title.toLowerCase().includes(q) || (t.description || "").toLowerCase().includes(q);
          })
          .sort((a, b) => {
            if (taskSortBy === "priority") {
              const rank = { high: 0, medium: 1, low: 2 };
              return (rank[a.priority] ?? 1) - (rank[b.priority] ?? 1);
            }
            if (taskSortBy === "newest") {
              return (b.createdAt || 0) - (a.createdAt || 0);
            }
            return (a.deadline || "9999-12-31").localeCompare(b.deadline || "9999-12-31");
          });

        return `
          <div class="view-enter space-y-6">
            <!-- Header & Live Progress Bar -->
            <section class="surface-card p-5 sm:p-6 space-y-4">
              <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                <div>
                  <h1 class="font-display text-2xl sm:text-3xl font-semibold" style="color: var(--ink-primary);">Task Manager</h1>
                  <p class="text-sm mt-0.5 tabular-nums" style="color: var(--ink-secondary);">
                    <strong style="color: var(--ink-primary);">${stats.completed}/${stats.total} completed</strong> · ${stats.percent}% done
                  </p>
                </div>
                <button type="button" id="openNewTaskModalBtn" class="btn-primary px-4 py-2.5 text-sm inline-flex items-center justify-center gap-2 self-start sm:self-auto">
                  <i data-lucide="plus" class="w-4 h-4"></i>
                  <span>Add New Task</span>
                </button>
              </div>
              <div class="progress-track h-3 w-full">
                <div class="progress-fill" style="width: ${stats.percent}%;"></div>
              </div>
            </section>

            <!-- Segmented Pending / Completed Tabs + Search & Filters -->
            <section class="surface-card p-4 sm:p-5 space-y-4">
              <div class="flex flex-col md:flex-row md:items-center justify-between gap-3">
                <!-- Status Tabs -->
                <div class="inline-flex p-1 rounded-2xl surface-beige self-start">
                  <button type="button" data-task-tab="pending" class="px-3.5 py-1.5 rounded-xl text-xs sm:text-sm font-semibold tabular-nums transition-colors"
                    style="${taskFilterStatus === "pending" ? "background: var(--bg-card); color: var(--ink-primary); box-shadow: 0 2px 6px rgba(58,37,27,0.08);" : "color: var(--ink-secondary);"}">
                    Pending (${stats.pending})
                  </button>
                  <button type="button" data-task-tab="completed" class="px-3.5 py-1.5 rounded-xl text-xs sm:text-sm font-semibold tabular-nums transition-colors"
                    style="${taskFilterStatus === "completed" ? "background: var(--bg-card); color: var(--ink-primary); box-shadow: 0 2px 6px rgba(58,37,27,0.08);" : "color: var(--ink-secondary);"}">
                    Completed (${stats.completed})
                  </button>
                  <button type="button" data-task-tab="all" class="px-3.5 py-1.5 rounded-xl text-xs sm:text-sm font-semibold tabular-nums transition-colors"
                    style="${taskFilterStatus === "all" ? "background: var(--bg-card); color: var(--ink-primary); box-shadow: 0 2px 6px rgba(58,37,27,0.08);" : "color: var(--ink-secondary);"}">
                    All (${stats.total})
                  </button>
                </div>

                <!-- Search & Dropdowns -->
                <div class="flex flex-wrap items-center gap-2 flex-1 md:justify-end">
                  <div class="relative flex-1 min-w-[160px] max-w-xs">
                    <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2" style="color: var(--ink-muted);"></i>
                    <input type="text" id="taskSearchInput" value="${escapeHtml(taskSearchQuery)}" class="field-input pl-9 py-2 text-sm" placeholder="Search tasks..." />
                  </div>
                  <select id="taskCategoryFilter" class="field-input w-auto py-2 text-sm" aria-label="Filter by category">
                    <option value="all" ${taskFilterCategory === "all" ? "selected" : ""}>All Categories</option>
                    ${CATEGORIES.map((c) => `<option value="${escapeHtml(c)}" ${taskFilterCategory === c ? "selected" : ""}>${escapeHtml(c)}</option>`).join("")}
                  </select>
                  <select id="taskPriorityFilter" class="field-input w-auto py-2 text-sm" aria-label="Filter by priority">
                    <option value="all" ${taskFilterPriority === "all" ? "selected" : ""}>All Priorities</option>
                    <option value="high" ${taskFilterPriority === "high" ? "selected" : ""}>High</option>
                    <option value="medium" ${taskFilterPriority === "medium" ? "selected" : ""}>Medium</option>
                    <option value="low" ${taskFilterPriority === "low" ? "selected" : ""}>Low</option>
                  </select>
                  <select id="taskSortSelect" class="field-input w-auto py-2 text-sm" aria-label="Sort tasks">
                    <option value="deadline" ${taskSortBy === "deadline" ? "selected" : ""}>Sort: Deadline</option>
                    <option value="priority" ${taskSortBy === "priority" ? "selected" : ""}>Sort: Priority</option>
                    <option value="newest" ${taskSortBy === "newest" ? "selected" : ""}>Sort: Newest</option>
                  </select>
                </div>
              </div>
            </section>

            <!-- Task Cards Grid -->
            ${filtered.length === 0
              ? `
                <div class="surface-card p-10 text-center space-y-3">
                  <div class="w-12 h-12 rounded-2xl mx-auto flex items-center justify-center surface-beige">
                    <i data-lucide="coffee" class="w-6 h-6" style="color: var(--accent-coffee);"></i>
                  </div>
                  <h3 class="font-display text-lg font-semibold" style="color: var(--ink-primary);">Nothing in this list yet</h3>
                  <p class="text-sm max-w-sm mx-auto" style="color: var(--ink-secondary);">
                    ${taskFilterStatus === "pending" ? "All caught up! Add a new task or switch tabs to review your completed wins." : "Check off a task or adjust your filters to see tasks here."}
                  </p>
                </div>
              `
              : `
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                  ${filtered.map((task) => renderTaskCard(task)).join("")}
                </div>
              `}
          </div>
        `;
      }

      function renderTaskCard(task) {
        const overdue = isOverdue(task);
        const creator = getUserById(task.userId);
        return `
          <article class="surface-card surface-card-interactive p-5 flex flex-col justify-between gap-4 ${task.completed ? "opacity-80" : ""}">
            <div class="space-y-3">
              <div class="flex items-start justify-between gap-3">
                <div class="flex items-start gap-3 min-w-0">
                  <button type="button" data-toggle-task="${escapeHtml(task.id)}" class="task-check mt-0.5 ${task.completed ? "checked" : ""}" aria-label="${task.completed ? "Mark incomplete" : "Mark complete"}">
                    ${task.completed ? `<i data-lucide="check" class="w-3.5 h-3.5"></i>` : ""}
                  </button>
                  <div class="min-w-0">
                    <h3 class="font-semibold text-base leading-snug ${task.completed ? "line-through" : ""}" style="color: var(--ink-primary);">
                      ${escapeHtml(task.title)}
                    </h3>
                    ${task.description ? `<p class="text-sm mt-1 leading-relaxed" style="color: var(--ink-secondary);">${escapeHtml(task.description)}</p>` : ""}
                  </div>
                </div>
                <div class="flex items-center gap-1 shrink-0">
                  <button type="button" data-edit-task="${escapeHtml(task.id)}" class="p-2 rounded-xl hover:bg-black/5 transition-colors" title="Edit task" aria-label="Edit task">
                    <i data-lucide="pencil" class="w-4 h-4" style="color: var(--ink-muted);"></i>
                  </button>
                  <button type="button" data-delete-task="${escapeHtml(task.id)}" class="p-2 rounded-xl hover:bg-black/5 transition-colors" title="Delete task" aria-label="Delete task">
                    <i data-lucide="trash-2" class="w-4 h-4" style="color: var(--accent-rose);"></i>
                  </button>
                </div>
              </div>

              ${task.image ? `
                <button type="button" data-view-img="${escapeHtml(task.id)}" class="block w-full overflow-hidden rounded-2xl border group relative" style="border-color: var(--border-warm);">
                  <img src="${escapeHtml(task.image)}" alt="Task attachment for ${escapeHtml(task.title)}" class="w-full h-44 object-cover transition-transform duration-300 group-hover:scale-[1.02]" />
                  <span class="absolute bottom-2.5 right-2.5 px-2.5 py-1 rounded-full text-[11px] font-semibold backdrop-blur-md" style="background: rgba(58,37,27,0.68); color: #FFFDF9;">
                    View photo
                  </span>
                </button>
              ` : ""}
            </div>

            <div class="flex flex-wrap items-center justify-between gap-2 pt-3 border-t text-xs" style="border-color: var(--border-warm);">
              <div class="flex flex-wrap items-center gap-1.5">
                ${priorityBadge(task.priority)}
                <span class="px-2.5 py-0.5 rounded-full font-medium surface-beige" style="color: var(--ink-secondary);">${escapeHtml(task.category)}</span>
                ${task.isShared ? `<span class="px-2.5 py-0.5 rounded-full font-semibold" style="background: var(--accent-rose-soft); color: var(--accent-rose);">Shared</span>` : ""}
              </div>
              <div class="flex items-center gap-2 tabular-nums" style="color: ${overdue ? "var(--accent-rose)" : "var(--ink-muted)"};">
                <i data-lucide="calendar" class="w-3.5 h-3.5"></i>
                <span class="${overdue ? "font-semibold" : ""}">${overdue ? "Overdue · " : ""}${escapeHtml(formatFriendlyDate(task.deadline))}</span>
                ${task.isShared && creator ? `<span class="opacity-75">· by ${escapeHtml(creator.username)}</span>` : ""}
              </div>
            </div>
          </article>
        `;
      }

      /* ---------- VIEW 3: LEADERBOARD ---------- */
      function renderLeaderboardView() {
        const activeUser = getActiveUser();
        const rankings = getLeaderboard(leaderboardRange);
        const topThree = rankings.slice(0, 3);

        return `
          <div class="view-enter space-y-6">
            <!-- Header -->
            <section class="surface-card p-5 sm:p-6 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
              <div>
                <div class="flex items-center gap-2.5">
                  <span class="w-10 h-10 rounded-2xl flex items-center justify-center" style="background: var(--accent-rose-soft); color: var(--accent-rose);">
                    <i data-lucide="trophy" class="w-5 h-5"></i>
                  </span>
                  <div>
                    <h1 class="font-display text-2xl sm:text-3xl font-semibold" style="color: var(--ink-primary);">Productivity Leaderboard</h1>
                    <p class="text-sm" style="color: var(--ink-secondary);">Rankings update automatically from personal tasks and shared tasks assigned to or completed by each member.</p>
                  </div>
                </div>
              </div>
              <div class="inline-flex p-1 rounded-2xl surface-beige self-start sm:self-auto">
                <button type="button" data-lb-range="weekly" class="px-4 py-1.5 rounded-xl text-xs sm:text-sm font-semibold transition-colors"
                  style="${leaderboardRange === "weekly" ? "background: var(--bg-card); color: var(--ink-primary); box-shadow: 0 2px 6px rgba(58,37,27,0.08);" : "color: var(--ink-secondary);"}">
                  This Week
                </button>
                <button type="button" data-lb-range="all" class="px-4 py-1.5 rounded-xl text-xs sm:text-sm font-semibold transition-colors"
                  style="${leaderboardRange === "all" ? "background: var(--bg-card); color: var(--ink-primary); box-shadow: 0 2px 6px rgba(58,37,27,0.08);" : "color: var(--ink-secondary);"}">
                  All Time
                </button>
              </div>
            </section>

            <!-- Top 3 Podium Cards -->
            <section class="grid grid-cols-1 md:grid-cols-3 gap-4">
              ${topThree.map((entry, idx) => {
                const isFirst = idx === 0;
                return `
                  <div class="surface-card p-5 flex flex-col justify-between gap-4 relative overflow-hidden ${isFirst ? "ring-2" : ""}" style="${isFirst ? "border-color: var(--accent-rose); --tw-ring-color: var(--accent-rose-soft);" : ""}">
                    <div class="flex items-start justify-between">
                      <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold tabular-nums"
                        style="background: ${isFirst ? "var(--accent-rose)" : "var(--bg-beige)"}; color: ${isFirst ? "#FFFDF9" : "var(--ink-primary)"};">
                        ${isFirst ? `<i data-lucide="crown" class="w-3.5 h-3.5"></i>` : ""}
                        <span>Rank #${idx + 1}</span>
                      </span>
                      <span class="text-xs font-semibold px-2.5 py-0.5 rounded-full surface-beige" style="color: var(--ink-secondary);">${escapeHtml(entry.user.role || "Member")}</span>
                    </div>

                    <div class="flex flex-col items-center text-center pt-1">
                      <img src="${escapeHtml(entry.user.avatar || DEFAULT_ASSETS.me)}" alt="${escapeHtml(entry.user.username)}" class="w-20 h-20 rounded-full object-cover border-4 shadow-sm" style="border-color: ${isFirst ? "var(--accent-pink)" : "var(--bg-beige)"};" />
                      <h2 class="font-display text-xl font-semibold mt-3" style="color: var(--ink-primary);">
                        ${escapeHtml(entry.user.username)}
                        ${entry.user.id === activeUser.id ? `<span class="text-xs font-sans font-semibold ml-1" style="color: var(--accent-rose);">(You)</span>` : ""}
                      </h2>
                      <p class="text-xs mt-0.5 tabular-nums" style="color: var(--ink-secondary);">
                        ${entry.completed}/${entry.total} tasks completed
                      </p>
                    </div>

                    <div class="space-y-2">
                      <div class="flex items-center justify-between text-xs font-semibold tabular-nums">
                        <span style="color: var(--ink-muted);">Completion</span>
                        <span style="color: var(--ink-primary);">${entry.percent}%</span>
                      </div>
                      <div class="progress-track h-2.5 w-full">
                        <div class="progress-fill" style="width: ${entry.percent}%;"></div>
                      </div>
                    </div>

                    <div class="flex items-center justify-between pt-2 border-t" style="border-color: var(--border-warm);">
                      <button type="button" data-cheer-user="${escapeHtml(entry.user.id)}" class="inline-flex items-center gap-1.5 text-xs font-semibold px-3 py-1.5 rounded-full transition-colors" style="background: var(--accent-rose-soft); color: var(--accent-rose);">
                        <i data-lucide="heart" class="w-3.5 h-3.5"></i>
                        <span class="tabular-nums">Cheer (${entry.user.cheers || 0})</span>
                      </button>
                      <button type="button" data-peek-user="${escapeHtml(entry.user.id)}" class="text-xs font-semibold hover:underline" style="color: var(--accent-coffee);">
                        View progress
                      </button>
                    </div>
                  </div>
                `;
              }).join("")}
            </section>

            <!-- Complete Detailed Standings -->
            <section class="surface-card p-5 sm:p-6 space-y-4">
              <div class="flex items-center justify-between">
                <h2 class="font-display text-xl font-semibold" style="color: var(--ink-primary);">All Battle Standings</h2>
                <button type="button" data-jump="shared" class="btn-soft px-3.5 py-2 text-xs inline-flex items-center gap-1.5">
                  <i data-lucide="user-plus" class="w-3.5 h-3.5"></i>
                  <span>Invite Friends</span>
                </button>
              </div>

              <div class="space-y-3">
                ${rankings.map((entry, idx) => `

      /* =========================================================
         5. MODALS (TASK ADD/EDIT, DELETE, LIGHTBOX, PEEK, AUTH, JOIN, SUPABASE)
         ========================================================= */
      let lastFocusedBeforeModal = null;

      function openModal(html) {
        lastFocusedBeforeModal = document.activeElement;
        const root = document.getElementById("modalRoot");
        root.innerHTML = html;
        root.classList.remove("hidden");
        if (window.lucide) lucide.createIcons({ nodes: [root] });
        const focusable = root.querySelector("input:not([type='hidden']), textarea, select, button");
        if (focusable) setTimeout(() => focusable.focus(), 20);
      }

      function closeModal() {
        const root = document.getElementById("modalRoot");
        if (root.classList.contains("hidden")) return;
        root.classList.add("hidden");
        root.innerHTML = "";
        if (lastFocusedBeforeModal && typeof lastFocusedBeforeModal.focus === "function") {
          lastFocusedBeforeModal.focus();
        }
        lastFocusedBeforeModal = null;
      }

      function openTaskModal(taskId = null, forceShared = false) {
        const existing = taskId ? state.tasks.find((t) => t.id === taskId) : null;
        const isSharedDefault = existing ? existing.isShared : forceShared;
        let pendingImageData = existing ? existing.image || "" : "";

        openModal(`
          <div class="surface-card w-full max-w-lg max-h-[90vh] overflow-y-auto p-6 space-y-4">
            <div class="flex items-center justify-between">
              <h2 class="font-display text-xl font-semibold" style="color: var(--ink-primary);">${existing ? "Edit Task" : (forceShared ? "Create Shared Task" : "Add New Task")}</h2>

            </div>

            <form id="taskModalForm" class="space-y-4">
              <div>
                <label for="taskTitleField" class="block text-xs font-semibold mb-1" style="color: var(--ink-secondary);">Task Title</label>
                <input type="text" id="taskTitleField" class="field-input" value="${escapeHtml(existing ? existing.title : "")}" placeholder="e.g., Finish chapter 4 summary" required maxlength="120" />
              </div>

              <div>
                <label for="taskDescField" class="block text-xs font-semibold mb-1" style="color: var(--ink-secondary);">Description</label>
                <textarea id="taskDescField" rows="3" class="field-input" placeholder="Add notes, checklist details, or links...">${escapeHtml(existing ? existing.description : "")}</textarea>
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <div>
                  <label for="taskDeadlineField" class="block text-xs font-semibold mb-1" style="color: var(--ink-secondary);">Deadline</label>
                  <input type="date" id="taskDeadlineField" class="field-input" value="${escapeHtml(existing ? existing.deadline : todayISO(0))}" />
                </div>
                <div>
                  <label for="taskPriorityField" class="block text-xs font-semibold mb-1" style="color: var(--ink-secondary);">Priority</label>
                  <select id="taskPriorityField" class="field-input">
                    <option value="low" ${existing && existing.priority === "low" ? "selected" : ""}>Low</option>
                    <option value="medium" ${!existing || existing.priority === "medium" ? "selected" : ""}>Medium</option>
                    <option value="high" ${existing && existing.priority === "high" ? "selected" : ""}>High</option>
                  </select>
                </div>
                <div>
                  <label for="taskCategoryField" class="block text-xs font-semibold mb-1" style="color: var(--ink-secondary);">Category</label>
                  <select id="taskCategoryField" class="field-input">
                    ${CATEGORIES.map((c) => `<option value="${escapeHtml(c)}" ${(existing ? existing.category : (forceShared ? "Shared Goal" : "Personal")) === c ? "selected" : ""}>${escapeHtml(c)}</option>`).join("")}
                  </select>
                </div>
              </div>

              <!-- Shared Toggle & Assignee -->
              <div class="surface-beige rounded-2xl p-3.5 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                <label class="inline-flex items-center gap-2.5 cursor-pointer text-sm font-semibold" style="color: var(--ink-primary);">
                  <input type="checkbox" id="taskSharedCheckbox" class="w-4 h-4 accent-[#C97A88]" ${isSharedDefault ? "checked" : ""} />
                  <span>Share in Shared Space</span>
                </label>
                <select id="taskAssigneeField" class="field-input w-auto py-1.5 text-xs ${isSharedDefault ? "" : "hidden"}">
                  <option value="all" ${!existing || existing.assigneeId === "all" ? "selected" : ""}>For Everyone</option>
                  ${state.users.map((u) => `<option value="${escapeHtml(u.id)}" ${existing && existing.assigneeId === u.id ? "selected" : ""}>Assign to ${escapeHtml(u.username)}</option>`).join("")}
                </select>
              </div>

              <!-- Image Attachment -->
              <div class="space-y-2">
                <label class="block text-xs font-semibold" style="color: var(--ink-secondary);">Attach Picture (optional)</label>
                <div class="flex items-center gap-2">
                  <label class="btn-soft px-3.5 py-2 text-xs cursor-pointer inline-flex items-center gap-1.5">
                    <i data-lucide="image-plus" class="w-4 h-4"></i>
                    <span>Upload Image</span>
                    <input type="file" id="taskImageUpload" accept="image/*" class="hidden" />
                  </label>
                  <button type="button" id="removeTaskImageBtn" class="${pendingImageData ? "" : "hidden"} text-xs font-semibold px-2.5 py-1.5 rounded-xl hover:bg-black/5" style="color: var(--accent-rose);">Remove photo</button>
                </div>
                <div id="taskImagePreviewWrap" class="${pendingImageData ? "" : "hidden"} rounded-2xl overflow-hidden border" style="border-color: var(--border-warm);">
                  <img id="taskImagePreview" src="${escapeHtml(pendingImageData)}" alt="Preview" class="w-full h-40 object-cover" />
                </div>
              </div>

              <div class="flex items-center justify-end gap-2 pt-2">
                <button type="button" data-close-modal class="btn-soft px-4 py-2.5 text-sm">Cancel</button>
                <button type="submit" class="btn-primary px-5 py-2.5 text-sm">${existing ? "Save Changes" : "Create Task"}</button>
              </div>
            </form>
          </div>
        `);

        const sharedCb = document.getElementById("taskSharedCheckbox");
        const assigneeSel = document.getElementById("taskAssigneeField");
        sharedCb.addEventListener("change", () => {
          assigneeSel.classList.toggle("hidden", !sharedCb.checked);
        });

        document.getElementById("taskImageUpload").addEventListener("change", async (e) => {
          const file = e.target.files && e.target.files[0];
          if (!file) return;
          try {
            pendingImageData = await uploadImageToStorageOrLocal(file, "task-images", 900, 700, 0.8);
            document.getElementById("taskImagePreview").src = pendingImageData;
            document.getElementById("taskImagePreviewWrap").classList.remove("hidden");
            document.getElementById("removeTaskImageBtn").classList.remove("hidden");
          } catch (err) {
            showToast("Could not load that image.");
          }
        });

        document.getElementById("removeTaskImageBtn").addEventListener("click", () => {
          pendingImageData = "";
          document.getElementById("taskImagePreview").src = "";
          document.getElementById("taskImagePreviewWrap").classList.add("hidden");
          document.getElementById("removeTaskImageBtn").classList.add("hidden");
        });

        document.getElementById("taskModalForm").addEventListener("submit", (e) => {
          e.preventDefault();
          const title = document.getElementById("taskTitleField").value.trim();
          if (!title) return;
          const payload = {
            title,
            description: document.getElementById("taskDescField").value.trim(),
            deadline: document.getElementById("taskDeadlineField").value,
            priority: document.getElementById("taskPriorityField").value,
            category: document.getElementById("taskCategoryField").value,
            isShared: sharedCb.checked,
            assigneeId: sharedCb.checked ? assigneeSel.value : null,
            image: pendingImageData
          };

          if (existing) {
            Object.assign(existing, payload);
            syncTaskToSupabase(existing, "upsert");
            showToast("Task updated!");
          } else {
            const newTask = {
              id: generateId("t"),
              userId: getActiveUser().id,
              completed: false,
              completedBy: null,
              createdAt: Date.now(),
              completedAt: null,
              ...payload
            };
            state.tasks.unshift(newTask);
            syncTaskToSupabase(newTask, "upsert");
            showToast(newTask.isShared ? "Shared task created!" : "Task added!");
          }
          saveState();
          closeModal();
          renderApp();
        });
      }

                        <img src="${escapeHtml(u.avatar || DEFAULT_ASSETS.me)}" alt="${escapeHtml(u.username)}" class="w-10 h-10 rounded-full object-cover border shrink-0" style="border-color: var(--border-warm);" />
                        <div class="min-w-0">
                          <div class="text-sm font-semibold truncate" style="color: var(--ink-primary);">${escapeHtml(u.username)}</div>
                          <div class="text-xs tabular-nums" style="color: var(--ink-muted);">${escapeHtml(u.role || "Member")} · ${st.completed}/${st.total} done</div>
                        </div>
                      </div>
                      ${isCur ? `<span class="text-xs font-semibold px-2.5 py-1 rounded-full" style="background: var(--accent-rose-soft); color: var(--accent-rose);">Active</span>` : `<i data-lucide="arrow-right" class="w-4 h-4" style="color: var(--ink-muted);"></i>`}

                  <span class="h-px flex-1" style="background: var(--border-warm);"></span>

                  ${GOOGLE_G_SVG}

                  <label for="signUpUsername" class="block text-xs font-semibold mb-1" style="color: var(--ink-secondary);">Username</label>

                <div>
                  <label for="signUpEmail" class="block text-xs font-semibold mb-1" style="color: var(--ink-secondary);">Email</label>

        });

        document.querySelectorAll("[data-modal-switch]").forEach((btn) => {
          btn.addEventListener("click", () => {
            const uid = btn.getAttribute("data-modal-switch");
            state.activeUserId = uid;
            saveState();
            closeModal();
            const u = getUserById(uid);
            showToast(`Signed in as ${u ? u.username : "Member"}`);
            renderApp(false);
          });
        });

        const joinBtn = document.getElementById("modalOpenJoinBtn");
        if (joinBtn) joinBtn.addEventListener("click", () => openJoinFriendModal());
        const cloudBtn = document.getElementById("modalOpenCloudBtn");
        if (cloudBtn) cloudBtn.addEventListener("click", () => openSupabaseModal());
        const signOutBtn = document.getElementById("modalSignOutBtn");
        if (signOutBtn) signOutBtn.addEventListener("click", () => signOutUser());

        const signInForm = document.getElementById("authSignInForm");
        if (signInForm) {
          signInForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const email = document.getElementById("signInEmail").value.trim().toLowerCase();
            const password = document.getElementById("signInPassword").value;
            if (supabaseConnected && supabaseClient) {
              const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
              if (error) {
                showToast(error.message || "Sign in failed.");
                return;
              }
              if (data && data.user) {
                state.activeUserId = data.user.id;
                await fetchSupabaseWorkspace();
                closeModal();
                showToast("Signed in via Supabase!");
                return;
              }
            }
            const found = state.users.find((u) => (u.email || "").toLowerCase() === email);
            if (!found) {
              showToast("No account found with that email — try Sign Up!");
              return;
            }
            state.activeUserId = found.id;
            saveState();
            closeModal();
            showToast(`Welcome back, ${found.username}!`);
            renderApp(false);
          });
        }

        const signUpForm = document.getElementById("authSignUpForm");
        if (signUpForm) {
          signUpForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const username = document.getElementById("signUpUsername").value.trim();
            const email = document.getElementById("signUpEmail").value.trim().toLowerCase();
            const password = document.getElementById("signUpPassword").value;
            const role = document.getElementById("signUpRole").value;
            let newId = generateId("u");
            if (supabaseConnected && supabaseClient) {
              const { data, error } = await supabaseClient.auth.signUp({ email, password });
              if (error) {
                showToast(error.message || "Sign up failed.");
                return;
              }
              if (data && data.user) {
                newId = data.user.id;
                await supabaseClient.from("profiles").upsert({
                  id: newId,
                  username,
                  role,
                  bio: "Ready to track daily wins together.",
                  theme: "cream-latte"
                });
              }
            }
            if (!supabaseConnected && state.users.some((u) => (u.email || "").toLowerCase() === email)) {
              showToast("An account with this email already exists — try Sign In.");
              return;
            }
            const newUser = {
              id: newId,
              username,
              email,
              role,
              bio: "Ready to track daily wins together.",
              avatar: DEFAULT_ASSETS.friend,
              cover: DEFAULT_ASSETS.cover,
              theme: "cream-latte",
              cheers: 0
            };
            state.users.push(newUser);
            state.activeUserId = newId;
            saveState();
            closeModal();
            showToast(`Account created for ${username}!`);
            renderApp(false);
          });
        }
      }
